name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tennis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tennis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tennis_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tennis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: python -m app.migrations

      - name: Run repository verification
        run: ./scripts/verify.sh
